<!DOCTYPE html>
<html lang="id" data-motion="full">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Sulthan Farrel Fathurrahman | Portofolio</title>
    <meta name="description"
        content="Portofolio Sulthan Farrel Fathurrahman — jaringan, infrastruktur, dan proyek-proyek yang pernah dikerjakan.">
    <meta name="theme-color" content="#2b3541">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Ruang server 3D (latar) -->
    <canvas id="bg" aria-hidden="true"></canvas>

    <!-- Kabel LAN yang menjalar mengikuti scroll -->
    <svg id="lan" class="lan" aria-hidden="true">
        <defs>
            <clipPath id="lan-clip">
                <rect id="lan-clip-rect" x="0" y="0" width="80" height="0" />
            </clipPath>
        </defs>
        <path id="lan-shadow" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="9" stroke-linecap="round" />
        <path id="lan-cable" fill="none" stroke="#4f9bff" stroke-width="6" stroke-linecap="round" />
        <path id="lan-pulse" fill="none" stroke="#e9f3ff" stroke-width="3" stroke-linecap="round"
            stroke-dasharray="3 46" clip-path="url(#lan-clip)" />
        <g id="lan-plug">
            <rect x="-7" y="-4" width="14" height="22" rx="2" fill="#c9d3dd" stroke="#6f7c8a" />
            <rect x="-5" y="14" width="10" height="9" fill="#e7c15a" />
            <path d="M-4 14v9M-1.300 14v9M1.300 14v9M4 14v9" stroke="#8a6d1c" stroke-width=".8" />
            <rect x="-4" y="-12" width="8" height="9" rx="1.500" fill="#4f9bff" />
        </g>
    </svg>

    <header class="nav" id="nav">
        <a href="#hero" class="brand"><i class="led"></i><span id="brand-name">farrel</span><em>@rack-01</em></a>
        <nav class="nav-links" id="nav-links" aria-label="Navigasi utama">
            <a href="#about">Tentang</a>
            <a href="#skills">Skill</a>
            <a href="#experience">Pengalaman</a>
            <a href="#projects">Project</a>
            <a href="#certificates">Sertifikat</a>
            <a href="#contact">Kontak</a>
        </nav>
        <div class="nav-actions">
            <button class="icon-btn" id="motion-toggle" type="button" aria-pressed="false" title="Kurangi animasi">
                <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round" stroke-linejoin="round">
                    <path d="M3 12h4l3-8 4 16 3-8h4" />
                </svg>
            </button>
            <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8"
                    stroke-linecap="round">
                    <path d="M4 7h16M4 12h16M4 17h16" />
                </svg>
            </button>
        </div>
    </header>

    <main>
        <!-- HERO + name tag -->
        <section id="hero" class="hero">
            <div class="lanyard" id="lanyard">
                <canvas id="lanyard-canvas"></canvas>
                <div class="tag" id="tag" aria-label="Name tag. Tarik atau geser untuk memainkannya.">
                    <div class="tag-clip"></div>
                    <div class="tag-hole"></div>
                    <div class="tag-head" id="tag-head"></div>
                    <div class="tag-photo"><img id="tag-img" alt="" draggable="false"><span id="tag-initials"></span>
                    </div>
                    <div class="tag-name" id="tag-name"></div>
                    <div class="tag-role" id="tag-role"></div>
                    <div class="tag-sub" id="tag-sub"></div>
                    <div class="tag-foot"><span class="barcode"></span><b id="tag-id"></b></div>
                </div>
            </div>

            <div class="wrap hero-inner">
                <div class="hero-text">
                    <p class="status"><i class="led"></i>RACK-01 · LINK UP · 1000/FULL</p>
                    <h1 id="hero-name"></h1>
                    <p class="hero-role" id="hero-role"></p>
                    <p class="hero-tag" id="hero-tagline"></p>
                    <div class="hero-cta">
                        <a href="#projects" class="btn">Lihat project</a>
                    </div>
                </div>
            </div>
        </section>

        <!-- TENTANG -->
        <section id="about" class="section">
            <div class="wrap">
                <div class="plate reveal"><span>01</span>Tentang</div>
                <div class="about-grid">
                    <div class="portrait reveal" id="portrait" tabindex="0"
                        aria-label="Foto saya. Arahkan kursor untuk melihat versi lain.">
                        <img class="p-base" id="p-base" alt="Foto Sulthan Farrel" draggable="false">
                        <img class="p-alt" id="p-alt" alt="" draggable="false">
                        <div class="p-tint"></div>
                        <span class="p-fallback" id="p-fallback"></span>
                        <i class="screw s1"></i><i class="screw s2"></i><i class="screw s3"></i><i class="screw s4"></i>
                    </div>
                    <div class="unit about-text reveal" id="about-text"></div>
                </div>
            </div>
        </section>

        <!-- SKILL -->
        <section id="skills" class="section">
            <div class="wrap">
                <div class="plate reveal"><span>02</span>Skill</div>
                <div class="grid grid-3" id="skill-grid"></div>
            </div>
        </section>

        <!-- PENGALAMAN -->
        <section id="experience" class="section">
            <div class="wrap">
                <div class="plate reveal"><span>03</span>Pengalaman</div>
                <div class="stack" id="exp-list"></div>
            </div>
        </section>

        <!-- PROJECT -->
        <section id="projects" class="section">
            <div class="wrap">
                <div class="plate reveal"><span>04</span>Project</div>
                <div class="grid grid-2" id="project-grid"></div>
            </div>
        </section>

        <!-- SERTIFIKAT -->
        <section id="certificates" class="section">
            <div class="wrap">
                <div class="plate reveal"><span>05</span>Sertifikat</div>
                <div class="grid grid-3" id="cert-grid"></div>
            </div>
        </section>

        <!-- KONTAK -->
        <section id="contact" class="section">
            <div class="wrap">
                <div class="plate reveal"><span>06</span>Kontak</div>
                <div class="patch reveal" id="contact-grid"></div>
            </div>
        </section>
    </main>

    <footer class="footer">
        <div class="wrap" id="footer-text"></div>
    </footer>

    <!-- Lightbox -->
    <div class="lightbox" id="lightbox" hidden>
        <button class="lb-close" type="button" aria-label="Tutup">×</button>
        <button class="lb-nav lb-prev" type="button" aria-label="Sebelumnya">‹</button>
        <figure><img id="lb-img" alt="">
            <figcaption id="lb-cap"></figcaption>
        </figure>
        <button class="lb-nav lb-next" type="button" aria-label="Berikutnya">›</button>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <script src="data/profile.js"></script>
    <script src="data/skills.js"></script>
    <script src="data/experiences.js"></script>
    <script src="data/projects.js"></script>
    <script src="data/certificates.js"></script>

    <script src="js/render.js"></script>
    <script src="js/scene3d.js"></script>
    <script src="js/lanyard.js"></script>
    <script src="js/animations.js"></script>
</body>

</html>
