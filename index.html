<!DOCTYPE html>
<html lang="id" data-motion="full">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=1280">
  <title>Sulthan Farrel Fathurrahman | Portfolio</title>
  <meta name="description" content="Portfolio of Sulthan Farrel Fathurrahman — networking, infrastructure, and projects.">
  <meta name="theme-color" content="#2b3541">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="css/style.css?v=3">
</head>
<body>

  <!-- Ruang server 3D (latar) -->
  <canvas id="bg" aria-hidden="true"></canvas>

  <!-- Kabel LAN yang menjalar mengikuti scroll -->
  <svg id="lan" class="lan" aria-hidden="true">
    <defs><clipPath id="lan-clip"><rect id="lan-clip-rect" x="0" y="0" width="80" height="0"/></clipPath></defs>
    <path id="lan-shadow" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="9" stroke-linecap="round"/>
    <path id="lan-cable" fill="none" stroke="#4f9bff" stroke-width="6" stroke-linecap="round"/>
    <path id="lan-pulse" fill="none" stroke="#e9f3ff" stroke-width="3" stroke-linecap="round" stroke-dasharray="3 46" clip-path="url(#lan-clip)"/>
    <g id="lan-plug">
      <rect x="-7" y="-4" width="14" height="22" rx="2" fill="#c9d3dd" stroke="#6f7c8a"/>
      <rect x="-5" y="14" width="10" height="9" fill="#e7c15a"/>
      <path d="M-4 14v9M-1.300 14v9M1.300 14v9M4 14v9" stroke="#8a6d1c" stroke-width=".8"/>
      <rect x="-4" y="-12" width="8" height="9" rx="1.500" fill="#4f9bff"/>
    </g>
  </svg>

  <!-- Name tag + lanyard: menutupi seluruh layar, jadi bisa ditarik ke mana saja -->
  <div class="lanyard" id="lanyard">
    <canvas id="lanyard-canvas"></canvas>
    <div class="tag" id="tag">
      <div class="tag-hook"></div>
      <div class="tag-holder">
        <div class="tag-slot"></div>
        <div class="tag-card">
          <i class="geo g1"></i><i class="geo g2"></i><i class="geo g3"></i><i class="geo g4"></i>
          <div class="tag-head" id="tag-head"></div>
          <div class="tag-photo"><img id="tag-img" alt="" draggable="false"><span id="tag-initials"></span></div>
          <div class="tag-name" id="tag-name"></div>
          <div class="tag-id" id="tag-id"></div>
          <div class="tag-role" id="tag-role"></div>
          <div class="tag-sub" id="tag-sub"></div>
        </div>
      </div>
    </div>
  </div>

  <header class="nav" id="nav">
    <nav class="nav-links" id="nav-links" aria-label="Main navigation">
      <a href="#about">About</a>
      <a href="#skills">Skills</a>
      <a href="#experience">Experience</a>
      <a href="#projects">Projects</a>
      <a href="#certificates">Certificates</a>
      <a href="#contact">Contact</a>
    </nav>
    <div class="nav-actions">
      <button class="icon-btn" id="motion-toggle" type="button" aria-pressed="false" title="Reduce motion">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>
      </button>
      <button class="icon-btn menu-btn" id="menu-btn" type="button" aria-label="Menu" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>
    </div>
  </header>

  <main>
    <!-- HERO -->
    <section id="hero" class="hero">
      <div class="wrap hero-inner">
        <div class="hero-text">
          <p class="status"><i class="led"></i>RACK-01 · LINK UP · 1000/FULL</p>
          <h1 id="hero-name"></h1>
          <p class="hero-role" id="hero-role"></p>
          <p class="hero-tag" id="hero-tagline"></p>
          <div class="hero-cta">
            <a href="#projects" class="btn">View projects</a>
          </div>
        </div>
      </div>
    </section>

    <!-- ABOUT -->
    <section id="about" class="section">
      <div class="wrap">
        <div class="plate xp"><span>01</span>About</div>
        <div class="about-grid">
          <div class="about-photo xp">
            <div class="portrait" id="portrait" tabindex="0" aria-label="My photo. Move the cursor over it to see another version.">
              <img class="p-base" id="p-base" alt="Foto Sulthan Farrel" draggable="false">
              <img class="p-alt" id="p-alt" alt="" draggable="false">
              <div class="p-tint"></div>
              <span class="p-fallback" id="p-fallback"></span>
            </div>
          </div>
          <div class="about-text xp" id="about-text"></div>
        </div>
      </div>
    </section>

    <!-- SKILLS -->
    <section id="skills" class="section">
      <div class="wrap">
        <div class="plate xp"><span>02</span>Skills</div>
        <div class="grid grid-3" id="skill-grid"></div>
      </div>
    </section>

    <!-- EXPERIENCE -->
    <section id="experience" class="section">
      <div class="wrap">
        <div class="plate xp"><span>03</span>Experience</div>
        <div class="stack" id="exp-list"></div>
      </div>
    </section>

    <!-- PROJECTS -->
    <section id="projects" class="section">
      <div class="wrap">
        <div class="plate xp"><span>04</span>Projects</div>
        <div class="grid grid-2" id="project-grid"></div>
      </div>
    </section>

    <!-- CERTIFICATES -->
    <section id="certificates" class="section">
      <div class="wrap">
        <div class="plate xp"><span>05</span>Certificates</div>
        <div class="grid grid-3" id="cert-grid"></div>
      </div>
    </section>

    <!-- CONTACT -->
    <section id="contact" class="section last">
      <div class="wrap">
        <div class="plate xp"><span>06</span>Contact</div>
        <div class="patch" id="contact-grid"></div>
      </div>
    </section>
  </main>

  <!-- Lightbox -->
  <div class="lightbox" id="lightbox" hidden>
    <button class="lb-close" type="button" aria-label="Close">×</button>
    <button class="lb-nav lb-prev" type="button" aria-label="Previous">‹</button>
    <figure><img id="lb-img" alt=""><figcaption id="lb-cap"></figcaption></figure>
    <button class="lb-nav lb-next" type="button" aria-label="Next">›</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

  <script src="data/profile.js?v=3"></script>
  <script src="data/skills.js?v=3"></script>
  <script src="data/experiences.js?v=3"></script>
  <script src="data/projects.js?v=3"></script>
  <script src="data/certificates.js?v=3"></script>

  <script src="js/render.js?v=3"></script>
  <script src="js/scene3d.js?v=3"></script>
  <script src="js/lanyard.js?v=3"></script>
  <script src="js/animations.js?v=3"></script>
</body>
</html>
